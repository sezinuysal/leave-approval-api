spring.application.name=leave-approval-api

# Default profile: in-memory H2 database (no setup needed).
# Use the "postgres" profile to run against PostgreSQL (see README).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Swagger UI: http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
